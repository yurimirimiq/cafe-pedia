# Render 배포 설정 (백엔드 + PostgreSQL). Render 대시보드 → New → Blueprint 에서 이 저장소를 고르면 아래대로 만들어진다
databases:
  - name: cafepedia-db
    plan: free
    region: singapore # 한국에서 가장 가까운 Render 지역

services:
  - type: web
    name: cafepedia-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    # 배포할 때마다: 패키지 설치 → 관리자 화면 정적 파일 모으기 → DB 마이그레이션
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    # 워커 1개: 검색 횟수 제한·동네별 캐시가 프로세스 메모리에 있어서 워커를 늘리면 따로 논다. 늘리려면 Redis 캐시부터
    startCommand: gunicorn config.wsgi --workers 1 --threads 4
    healthCheckPath: /api/hello/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: cafepedia-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # 아래는 비밀값·배포 주소라 Render 대시보드에서 직접 입력한다 (sync: false)
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS # 프론트 주소, 예: https://cafe-pedia.vercel.app
        sync: false
      - key: KAKAO_REDIRECT_URI # 프론트 주소 + /auth/kakao
        sync: false
